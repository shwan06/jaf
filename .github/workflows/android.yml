name: Build Android app

# Builds:
#   • a debug APK you can sideload on your own phone for testing, and
#   • a release AAB (Android App Bundle) — the format Google Play requires.
#
# The AAB is signed automatically when the four signing secrets below are set on
# the repo (Settings → Secrets and variables → Actions); otherwise it is built
# unsigned and Play will reject it. See android/README.md for how to create the
# keystore and add the secrets.
#
#   ANDROID_KEYSTORE_BASE64   base64 of your .jks file
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#
# The web app in static/ is bundled into the APK/AAB at build time, so pushes
# that change the course content rebuild the app too.

on:
  workflow_dispatch:
  push:
    branches: ["master"]
    paths:
      - "android/**"
      - "static/**"
      - ".github/workflows/android.yml"

permissions:
  # contents: write is needed to publish the APK as a Release asset, which —
  # unlike an Actions artifact — downloads directly, needs no GitHub login, and
  # isn't wrapped in a .zip. Actions artifacts can't be downloaded from the
  # GitHub mobile app at all.
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # The `secrets` context can't be used in a step-level `if:`, so the presence
    # of a keystore is surfaced through `env` instead.
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Google removed the legacy "tools" package from the SDK repository,
          # and the action's old default ("tools platform-tools") made
          # sdkmanager exit 1, breaking every build. Request platform-tools
          # only; Gradle downloads the platform and build-tools it needs once
          # the licences below are accepted.
          packages: platform-tools

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.11.1

      - name: Restore signing keystore
        if: env.KEYSTORE_BASE64 != ''
        working-directory: android
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          cat > keystore.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release AAB (for Google Play)
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Remove signing material
        if: always()
        working-directory: android
        run: rm -f release.jks keystore.properties

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: russian-az-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: russian-az-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # Publish the APK to a rolling "android-latest" release so it can be
      # installed straight from a phone: one tap, no login, no unzipping.
      # The tag is reused every build, so the download URL never changes:
      #   https://github.com/shwan06/jaf/releases/download/android-latest/russian-az.apk
      - name: Publish APK as a downloadable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk russian-az.apk
          NOTES="Test build of Русский от А до Я, from commit ${GITHUB_SHA::7}.

          Tap **russian-az.apk** below to install. You will need to allow
          \"Install unknown apps\" for your browser the first time.

          The whole course is bundled inside the app, so it works with no
          internet — worth testing in airplane mode.

          This is a debug build for testing, not the Play Store release."
          if gh release view android-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload android-latest russian-az.apk \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit android-latest --repo "$GITHUB_REPOSITORY" --notes "$NOTES"
          else
            gh release create android-latest russian-az.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "Latest Android test build" \
              --notes "$NOTES"
          fi
