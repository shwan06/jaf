name: Deploy to GitHub Pages

# Publishes the static site in `static/` to GitHub Pages.
# One-time setup: in the repo, go to Settings → Pages → Build and deployment
# → Source: "GitHub Actions". After that, every push to the branch below
# (or a manual run via the Actions tab) deploys automatically.

on:
  push:
    branches: ["master", "claude/russian-grammar-app-efni4h"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate content JSON (parses, no duplicate cards, path.json references resolve)
        run: node tools/validate_content.js
      - name: Check audioHash() (app.js) matches audio_hash() (build_audio.py)
        run: node tests/audio_hash_parity.test.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Re-enable Pages automatically if it was turned off (fixes the
          # "Get Pages site failed … Not Found" error) using the workflow token.
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: static
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
